CONFIG_GPIO=y
CONFIG_ADC=n
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_PWM=y
CONFIG_NRFX_GPPI=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
